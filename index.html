<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 认知日报</title>
  <!-- marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <!-- highlight.js for code syntax -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/highlight.min.js"></script>
  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #18181b;
      --surface-hover: #1f1f24;
      --border: #2a2a30;
      --text-primary: #f0f0f5;
      --text-secondary: #8b8b9a;
      --text-muted: #55555f;
      --accent: #7c6af7;
      --accent-dim: #3d3668;
      --green: #34d399;
      --tag-bg: #1e1e28;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ---- Header ---- */
    header {
      border-bottom: 1px solid var(--border);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: rgba(13,13,15,0.92);
      backdrop-filter: blur(12px);
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .logo-icon { font-size: 22px; }
    .header-meta { font-size: 13px; color: var(--text-muted); }
    .live-dot {
      display: inline-block;
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ---- Layout ---- */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* ---- Hero ---- */
    .hero {
      text-align: center;
      padding: 60px 0 48px;
    }
    .hero h1 {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #fff 30%, #7c6af7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 14px;
    }
    .hero p {
      color: var(--text-secondary);
      font-size: 16px;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* ---- Stats bar ---- */
    .stats {
      display: flex;
      gap: 24px;
      justify-content: center;
      margin: 32px 0 48px;
    }
    .stat {
      text-align: center;
      padding: 16px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .stat-num { font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* ---- Section title ---- */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* ---- Report cards ---- */
    #report-list { display: flex; flex-direction: column; gap: 14px; }

    .report-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .report-card:hover {
      border-color: var(--accent-dim);
      background: var(--surface-hover);
      transform: translateY(-1px);
    }
    .report-card-left { flex: 1; min-width: 0; }
    .report-date {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .report-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .report-preview {
      font-size: 13px;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.6;
    }
    .report-arrow {
      color: var(--text-muted);
      font-size: 20px;
      flex-shrink: 0;
      transition: transform 0.2s, color 0.2s;
    }
    .report-card:hover .report-arrow {
      color: var(--accent);
      transform: translateX(4px);
    }
    .new-badge {
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* ---- Empty state ---- */
    .empty {
      text-align: center;
      padding: 80px 0;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty p { font-size: 15px; }

    /* ---- Modal (report detail) ---- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      z-index: 200;
      padding: 40px 20px;
      overflow-y: auto;
    }
    .modal-overlay.open { display: flex; justify-content: center; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 48px;
      max-width: 780px;
      width: 100%;
      position: relative;
      animation: fadeUp 0.25s ease;
      align-self: flex-start;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .modal-close {
      position: absolute;
      top: 20px; right: 24px;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 18px;
      width: 36px; height: 36px;
      border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }
    .modal-close:hover { border-color: var(--accent); color: var(--text-primary); }
    .modal-date {
      font-size: 12px; color: var(--accent); font-weight: 600;
      margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px;
    }

    /* ---- Markdown content styles ---- */
    .modal-body {
      color: var(--text-primary);
      line-height: 1.85;
      font-size: 15px;
      word-break: break-word;
    }
    .modal-body h1 {
      font-size: 22px; font-weight: 700; margin: 0 0 16px;
      color: var(--text-primary);
    }
    .modal-body h2 {
      font-size: 18px; font-weight: 600; margin: 28px 0 12px;
      color: var(--text-primary);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .modal-body h3 {
      font-size: 16px; font-weight: 600; margin: 24px 0 10px;
      color: var(--accent);
    }
    .modal-body h4 {
      font-size: 15px; font-weight: 600; margin: 18px 0 8px;
      color: var(--text-secondary);
    }
    .modal-body p {
      margin: 0 0 14px;
      color: var(--text-primary);
    }
    .modal-body ul, .modal-body ol {
      margin: 0 0 14px 20px;
    }
    .modal-body li { margin-bottom: 6px; }
    .modal-body a {
      color: var(--accent);
      text-decoration: none;
    }
    .modal-body a:hover { text-decoration: underline; }
    .modal-body strong { color: var(--text-primary); }
    .modal-body em { color: var(--text-secondary); font-style: italic; }
    .modal-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }
    .modal-body blockquote {
      border-left: 3px solid var(--accent-dim);
      margin: 0 0 14px;
      padding: 8px 16px;
      background: rgba(124,106,247,0.05);
      border-radius: 0 6px 6px 0;
      color: var(--text-secondary);
    }
    .modal-body code {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      background: #1a1a22;
      color: #e879f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    .modal-body pre {
      background: #141418;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 0 0 16px;
    }
    .modal-body pre code {
      background: none;
      color: inherit;
      padding: 0;
      border-radius: 0;
      font-size: 13px;
    }
    /* Emoji line styling */
    .modal-body p:has(> strong:first-child) {
      margin-bottom: 8px;
    }

    /* Loading spinner */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-muted);
      padding: 40px;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Footer ---- */
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 28px;
      color: var(--text-muted);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      .hero h1 { font-size: 28px; }
      .modal { padding: 28px 20px; }
      .stats { flex-wrap: wrap; gap: 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-icon">🧠</span>
    AI 认知日报
  </div>
  <div class="header-meta">
    <span class="live-dot"></span>每日 09:00 自动更新
  </div>
</header>

<div class="container">
  <div class="hero">
    <h1>每天理解 AI 一点点</h1>
    <p>自动收集 HN、arXiv、GitHub Trending、Reddit 等 7 个来源的 AI 动态，用前端工程师能懂的语言深度解析。</p>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="total-count">0</div>
      <div class="stat-label">累计日报</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="streak-count">0</div>
      <div class="stat-label">连续天数</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="latest-date">—</div>
      <div class="stat-label">最新一期</div>
    </div>
  </div>

  <div class="section-title">往期归档</div>
  <div id="report-list">
    <div class="empty">
      <div class="empty-icon">📭</div>
      <p>暂无报告，明天早上 9 点见～</p>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <div class="modal-date" id="modal-date"></div>
    <div class="modal-body" id="modal-body">
      <div class="loading"><div class="spinner"></div>加载中...</div>
    </div>
  </div>
</div>

<footer>
  由 Hermes Agent 自动生成 · 每日深度调研驱动
</footer>

<script>
// ---- Configure marked ----
marked.setOptions({
  gfm: true,
  breaks: true,
});

// Use highlight.js for code blocks
marked.use({
  renderer: {
    code(token) {
      const { text, lang } = token;
      if (lang && hljs.getLanguage(lang)) {
        try {
          return `<pre><code class="hljs language-${lang}">${hljs.highlight(text, { language: lang }).value}</code></pre>`;
        } catch {}
      }
      return `<pre><code class="hljs">${hljs.highlightAuto(text).value}</code></pre>`;
    }
  }
});

// ---- Load reports from JSON index ----
async function loadReports() {
  try {
    const res = await fetch('reports/index.json');
    if (!res.ok) throw new Error('no index');
    const reports = await res.json();
    renderReports(reports);
  } catch {
    // keep empty state
  }
}

function renderReports(reports) {
  if (!reports || reports.length === 0) return;

  // stats
  document.getElementById('total-count').textContent = reports.length;
  document.getElementById('latest-date').textContent = reports[0].date.slice(5); // MM-DD

  // streak: count consecutive days from today backwards
  const today = new Date();
  let streak = 0;
  for (let i = 0; i < reports.length; i++) {
    const d = new Date(reports[i].date);
    const diff = Math.round((today - d) / 86400000);
    if (diff === i) streak++;
    else break;
  }
  document.getElementById('streak-count').textContent = streak;

  // list
  const list = document.getElementById('report-list');
  list.innerHTML = '';
  reports.forEach((r, idx) => {
    const card = document.createElement('a');
    card.className = 'report-card';
    card.href = '#';
    card.innerHTML = `
      <div class="report-card-left">
        <div class="report-date">
          📅 ${r.date}
          ${idx === 0 ? '<span class="new-badge">NEW</span>' : ''}
        </div>
        <div class="report-title">${escapeHtml(r.title || r.date + ' 日报')}</div>
        <div class="report-preview">${escapeHtml(r.preview || '')}</div>
      </div>
      <div class="report-arrow">→</div>
    `;
    card.addEventListener('click', (e) => {
      e.preventDefault();
      openReport(r);
    });
    list.appendChild(card);
  });
}

async function openReport(r) {
  const overlay = document.getElementById('modal-overlay');
  const body = document.getElementById('modal-body');
  const dateEl = document.getElementById('modal-date');

  dateEl.textContent = r.date;
  body.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  try {
    const res = await fetch(`reports/${r.file}`);
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    // Render Markdown
    body.innerHTML = marked.parse(text);
    // Re-run highlight on any code blocks that weren't caught
    body.querySelectorAll('pre code:not(.hljs)').forEach(el => hljs.highlightElement(el));
  } catch {
    body.innerHTML = '<p style="color:var(--text-muted)">加载失败，请稍后重试。</p>';
  }
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

loadReports();
</script>
</body>
</html>
